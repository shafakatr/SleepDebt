<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Energy">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23131A2B'/%3E%3Cpath d='M20 122 Q52 58 92 76 T160 56' stroke='%23E9B44C' stroke-width='11' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Sleep debt &amp; energy curve</title>
<meta name="description" content="Turn Apple Health sleep data into a sleep debt figure and a predicted energy curve for your day. Free, open source, and computed entirely in your browser.">
<meta property="og:title" content="Sleep debt &amp; energy curve">
<meta property="og:description" content="Two numbers hide in your sleep data: how much you owe, and when your energy peaks and dips. Nothing is uploaded.">
<meta property="og:type" content="website">
<style>
  :root{
    --ink:#131A2B; --ink-2:#1B2440; --ink-3:#222D4E; --line:#2E3A5C; --line-soft:rgba(46,58,92,.6);
    --paper:#E7E3DA; --dim:#98A2BA; --faint:#6A748A;
    --gold:#E9B44C; --cool:#5F84B1; --owed:#C2553F;
    --deep:#4B6FA8; --rem:#9B7FC4; --core:#5E8F87;
    --r:22px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--ink)}
  body{
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--paper); line-height:1.5; font-size:16px;
    padding:max(24px,env(safe-area-inset-top)) 24px calc(48px + env(safe-area-inset-bottom));
    max-width:1560px; margin:0 auto;
  }
  @media (max-width:640px){ body{padding:max(16px,env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))} }
  .display{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; font-weight:400}
  .eyebrow,.lbl{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:600}
  svg{display:block; width:100%; height:auto}

  header{display:grid; grid-template-columns:1fr auto; column-gap:16px; align-items:start; margin:6px 0 28px}
  header .eyebrow{grid-column:1; grid-row:1}
  header h1{grid-column:1; grid-row:2; font-size:36px; margin:2px 0 0; letter-spacing:-.01em; line-height:1.1}
  .hdr-actions{grid-column:2; grid-row:1/3; display:flex; gap:12px; align-items:center}
  @media (max-width:640px){
    header{margin-bottom:20px} header h1{font-size:28px; grid-column:1/-1; margin-top:6px}
    .hdr-actions{grid-row:1; gap:10px}
    button.pill{padding:7px 13px; font-size:13px} button.iconbtn{width:40px; height:40px; border-radius:12px}
  }

  button{background:var(--gold); color:#1A1406; border:0; border-radius:10px; padding:12px 18px;
    font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; min-height:44px}
  button.ghost{background:transparent; color:var(--dim); border:1px solid var(--line)}
  button.pill{background:rgba(233,180,76,.14); color:var(--gold); border-radius:999px; padding:9px 16px; font-size:14px; min-height:0}
  button.pill span{opacity:.6; margin-left:4px}
  button.iconbtn{width:46px; height:46px; padding:0; min-height:0; border-radius:14px; background:var(--ink-3);
    border:1px solid var(--line); color:var(--paper); display:flex; align-items:center; justify-content:center}
  button.iconbtn svg{width:20px; height:20px}
  button.x{background:transparent; color:var(--dim); font-size:26px; line-height:1; padding:0 6px; min-height:0}

  .grid{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:20px}
  .card{background:var(--ink-2); border:1px solid var(--line-soft); border-radius:var(--r); padding:26px 28px; min-width:0}
  @media (max-width:640px){ .card{padding:20px 18px; --r:18px} .grid{gap:14px} }
  .c4{grid-column:span 4} .c5{grid-column:span 5} .c6{grid-column:span 6} .c7{grid-column:span 7} .c8{grid-column:span 8} .c12{grid-column:span 12}
  .col{display:flex; flex-direction:column; gap:20px; min-width:0}
  @media (max-width:1080px){ .c4,.c5,.c6,.c7,.c8{grid-column:span 12} .col{gap:14px} }
  .card-hd{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:18px}
  .card-hd h2{font-size:17px; font-weight:600; margin:0; white-space:nowrap}
  .card-hd .meta{font-size:14px; color:var(--dim); text-align:right; flex:0 1 auto}
  .note{font-size:15px; color:var(--dim); margin:18px 0 0; line-height:1.5}

  /* score */
  .score{display:flex; align-items:center; gap:28px}
  .ring{flex:0 0 120px; width:120px; height:120px; position:relative}
  .ring svg{position:absolute; inset:0}
  .ring b{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:44px}
  .score .txt p{margin:0}
  .score .lead{font-size:28px; line-height:1.2}
  .score .sub{font-size:16px; color:var(--dim); margin-top:8px !important}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:28px; padding-top:24px; border-top:1px solid var(--line-soft)}
  .stat .val{font-size:34px; line-height:1.15; margin-top:8px; display:block}
  .stat .val.owed{color:var(--owed)}
  .stat .sub{font-size:14px; color:var(--dim); margin-top:2px}
  @media (max-width:640px){
    .score{gap:18px} .ring{flex-basis:92px; width:92px; height:92px} .ring b{font-size:34px}
    .score .lead{font-size:23px} .score .sub{font-size:15px}
    .stats{gap:10px; margin-top:22px; padding-top:18px} .stat .val{font-size:22px; white-space:nowrap}
  }

  /* tonight */
  .bigtime{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin:6px 0 26px}
  .bigtime .t{font-size:52px; color:var(--gold); line-height:1}
  .bigtime .in{font-size:16px; color:var(--dim)}
  .tl{position:relative; height:66px; margin:0 6px}
  .tl .track{position:absolute; left:0; right:0; top:6px; height:2px; background:var(--line)}
  .tl .track i{position:absolute; left:0; top:0; height:100%; background:var(--gold)}
  .tl .d{position:absolute; top:0; width:14px; height:14px; border-radius:50%; transform:translateX(-50%);
    border:2px solid var(--gold); background:var(--gold)}
  .tl .d.hollow{background:var(--ink-2)}
  .tl .p{position:absolute; top:24px; font-size:14px; line-height:1.25; white-space:nowrap}
  .tl .p .s{display:block; font-size:12.5px; color:var(--dim); margin-top:2px}
  .tl .p.gold{color:var(--gold)}
  @media (max-width:640px){ .bigtime .t{font-size:42px} .tl{height:76px} .tl .p{font-size:13px} .tl .p .s{white-space:normal; max-width:64px; font-size:11.5px; margin:2px auto 0} }

  /* energy */
  .chartwrap{margin:0 -6px}
  .legend{display:flex; gap:18px; flex-wrap:wrap; font-size:14px; color:var(--dim); margin:14px 2px 0}
  .legend span{display:inline-flex; align-items:center; gap:8px}
  .sw{width:16px; height:3px; border-radius:2px; display:inline-block}
  .sq{width:12px; height:12px; border-radius:3px; display:inline-block}

  /* habits */
  ul.hab{list-style:none; margin:0 -12px; padding:0}
  ul.hab li{display:flex; align-items:center; gap:14px; padding:15px 12px; border-bottom:1px solid var(--line-soft); cursor:pointer; border-radius:14px}
  ul.hab li:last-child{border-bottom:0}
  ul.hab li.next{background:var(--ink-3); border-bottom-color:transparent}
  ul.hab .box{flex:0 0 30px; width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--ink)}
  ul.hab li.done .box{background:var(--gold); border-color:var(--gold)}
  ul.hab .pip{flex:0 0 8px; width:8px; height:8px; border-radius:50%}
  ul.hab .body{flex:1; min-width:0}
  ul.hab .nm{display:block; font-size:17px; font-weight:600}
  ul.hab li.done .nm{color:var(--dim); text-decoration:line-through}
  ul.hab .tm{display:block; font-size:15px; color:var(--dim); font-variant-numeric:tabular-nums}
  ul.hab li.next .tm{color:var(--gold)}
  ul.hab .st{font-size:14px; color:var(--dim); text-align:right; max-width:72px; line-height:1.25}
  ul.hab .st.gold{color:var(--gold)}

  /* 14 nights */
  .bc{position:relative; height:128px; margin-top:8px}
  .bc .needline{position:absolute; left:0; right:0; border-top:1.5px dashed var(--dim); opacity:.75}
  .bc .needline span{position:absolute; right:0; bottom:3px; font-size:13px; color:var(--dim); white-space:nowrap}
  .bc .bars{position:absolute; inset:0; display:flex; align-items:flex-end; gap:8px}
  .bc .bars i{flex:1; display:block; background:var(--cool); border-radius:6px 6px 3px 3px; min-height:3px}
  .bc .bars i.short{background:var(--owed)}
  .days{display:flex; gap:8px; margin-top:8px}
  .days span{flex:1; text-align:center; font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums}
  @media (max-width:640px){ .bc .bars,.days{gap:4px} .days span{font-size:11.5px} }
  .key{display:flex; gap:18px; flex-wrap:wrap; font-size:14px; color:var(--dim); margin-top:16px}
  .key span{display:inline-flex; align-items:center; gap:8px}
  .dot{width:12px; height:12px; border-radius:3px; display:inline-block}

  /* stages */
  .stagebar{display:flex; height:12px; border-radius:6px; overflow:hidden; margin-top:6px}
  .stagebar i{display:block}

  /* recent nights */
  ul.nights{list-style:none; margin:0; padding:0}
  @media (min-width:800px){ ul.nights{column-count:2; column-gap:40px} }
  ul.nights li{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line-soft); cursor:pointer; font-size:15px; break-inside:avoid}
  ul.nights .dt{flex:0 0 62px; color:var(--dim)}
  ul.nights .as{flex:0 0 70px; font-variant-numeric:tabular-nums}
  ul.nights .ef{flex:0 0 46px; color:var(--dim); font-variant-numeric:tabular-nums; text-align:right}
  ul.nights .fg{flex:1; font-size:13px; color:var(--dim); text-align:right}
  ul.nights li.ext .fg{color:var(--rem)}
  ul.nights li.ext .ef{color:var(--paper)}

  /* data form + panel */
  textarea{width:100%; margin-top:10px; min-height:120px; padding:12px; background:var(--ink);
    color:var(--paper); border:1px solid var(--line); border-radius:10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; line-height:1.6; resize:vertical}
  .row{display:flex; gap:9px; align-items:center; margin-top:11px; flex-wrap:wrap}
  #grab{width:100%; font-size:16px}
  label.need{font-size:13px; color:var(--dim); display:inline-flex; align-items:center; gap:7px}
  input[type=number]{width:66px; padding:9px 8px; background:var(--ink); color:var(--paper);
    border:1px solid var(--line); border-radius:6px; font-family:inherit; font-size:14px}
  .status{font-size:13px; color:var(--dim); margin:10px 0 0; min-height:18px}
  .overlay{position:fixed; inset:0; background:rgba(8,12,24,.62); display:flex; align-items:flex-start; justify-content:center;
    padding:max(24px,env(safe-area-inset-top)) 16px 24px; z-index:10; overflow:auto; backdrop-filter:blur(4px)}
  .sheet{background:var(--ink-2); border:1px solid var(--line); border-radius:var(--r); padding:22px 26px 24px; width:100%; max-width:660px}
  .sheet .card-hd{margin-bottom:6px}
  details{margin-top:18px; border-top:1px solid var(--line-soft); padding-top:10px}
  summary{cursor:pointer; font-size:14px; color:var(--dim); padding:6px 0}

  /* setup / empty state */
  .hero{max-width:60ch; margin:8px 0 32px}
  .hero h2{font-size:34px; margin:6px 0 12px; line-height:1.2}
  .hero p{font-size:17px; color:var(--dim); margin:0 0 20px}
  .hero .fine{font-size:14px; margin:16px 0 0}
  #demo{font-size:16px; padding:13px 22px}
  .setup h3{font-size:17px; font-weight:600; margin:0 0 6px}
  .setup p{font-size:14.5px; color:var(--dim); margin:0 0 12px}
  .setup ol{margin:0; padding-left:20px; font-size:14.5px; color:var(--dim)}
  .setup li{margin-bottom:8px}
  .setup code{font-size:12.5px; color:var(--paper); background:var(--ink-3); padding:2px 5px; border-radius:4px}
  .setup .warn{color:var(--paper); margin-top:14px}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
var root=document.getElementById('root');
var KEY='sleep-energy-v2';
var GAP=3;
var state={text:'',need:null,done:{},ext:{},sample:false};
var ui={open:false}, lastStatus='';
var AWAKE=/awake|in\s*bed|inbed/i, DEEP=/deep/i, REMX=/rem/i;
var HOST=(typeof window!=='undefined'&&window.storage&&window.storage.get)?window.storage:null;
var ICON='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">'+
  '<path d="M3 5.5h14M3 10h14M3 14.5h14"/>'+
  '<circle cx="7.5" cy="5.5" r="2" fill="var(--ink-3)"/><circle cx="12.5" cy="10" r="2" fill="var(--ink-3)"/><circle cx="8.5" cy="14.5" r="2" fill="var(--ink-3)"/></svg>';

function load(cb){
  if(HOST){
    HOST.get(KEY).then(function(r){
      try{ if(r&&r.value){var p=JSON.parse(r.value); if(typeof p.text==='string'){state=p; state.done=state.done||{}; state.ext=state.ext||{};}} }catch(e){}
      cb();
    }).catch(cb); return;
  }
  try{ var s=localStorage.getItem(KEY); if(s){var p=JSON.parse(s); if(typeof p.text==='string'){state=p; state.done=state.done||{}; state.ext=state.ext||{};}} }catch(e){}
  cb();
}
function save(){
  try{
    if(HOST){ HOST.set(KEY,JSON.stringify(state)); return true; }
    localStorage.setItem(KEY,JSON.stringify(state)); return true;
  }catch(e){ return false; }
}

function srnd(seed){var x=seed>>>0;return function(){x=(x+0x6D2B79F5)>>>0;var t=x;
  t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}
function p2(n){return String(n).padStart(2,'0')}
function stamp(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())}
function makeSample(){
  var plan=[[95,392,0],[150,300,0],[75,438,0],[130,352,0],[45,455,0],
            [110,368,52],[85,410,0],[165,295,0],[60,470,0],[120,360,0],
            [100,385,0],[140,330,0],[70,445,0],[88,404,0]];
  var out=[], base=new Date(); base.setHours(0,0,0,0);
  for(var i=0;i<plan.length;i++){
    var wd=new Date(base); wd.setDate(base.getDate()-(plan.length-1-i));
    var on=new Date(wd); on.setHours(22,0,0,0); on.setDate(on.getDate()-1);
    on=new Date(+on+plan[i][0]*60000);
    var total=plan[i][1], aw=plan[i][2], r=srnd(1000+i), t=new Date(+on), slept=0, placed=false;
    while(slept<total){
      var f=slept/total, len, st;
      if(f<0.06){ st='Core'; len=10+Math.floor(r()*12); }
      else if(f<0.40){ st=r()<0.45?'Deep':'Core'; len=8+Math.floor(r()*28); }
      else if(f<0.75){ st=r()<0.30?'REM':'Core'; len=10+Math.floor(r()*32); }
      else { st=r()<0.45?'REM':'Core'; len=10+Math.floor(r()*30); }
      if(slept+len>total) len=total-slept;
      if(len<=0) break;
      var e=new Date(+t+len*60000);
      out.push(stamp(t)+' | '+stamp(e)+' | '+st);
      t=e; slept+=len;
      if(!placed && aw>0 && f>0.33){
        var ae=new Date(+t+aw*60000);
        out.push(stamp(t)+' | '+stamp(ae)+' | Awake'); t=ae; placed=true;
      } else if(r()<0.16 && slept<total){
        var se=new Date(+t+(1+Math.floor(r()*4))*60000);
        out.push(stamp(t)+' | '+stamp(se)+' | Awake'); t=se;
      }
    }
  }
  return out.join('\n');
}

function parseSegments(text){
  var segs=[];
  text.split(/\n+/).forEach(function(line){
    if(!line.trim()) return;
    var p=line.split('|').map(function(s){return s.trim()});
    if(p.length<3) return;
    var a=new Date(p[0].replace(' ','T')), b=new Date(p[1].replace(' ','T'));
    if(isNaN(a)||isNaN(b)||b<=a) return;
    segs.push({start:a,end:b,stage:p[2],hours:(b-a)/3600000});
  });
  segs.sort(function(x,y){return x.start-y.start});
  return segs;
}
function buildNights(segs){
  var ps=[],cur=null;
  segs.forEach(function(s){
    if(cur&&(s.start-cur.lastEnd)/3600000<=GAP){cur.segs.push(s); if(s.end>cur.lastEnd)cur.lastEnd=s.end;}
    else{ if(cur)ps.push(cur); cur={segs:[s],lastEnd:s.end}; }
  });
  if(cur)ps.push(cur);
  return ps.map(function(p){
    var as=p.segs.filter(function(s){return !AWAKE.test(s.stage)});
    if(!as.length) return null;
    var asleep=as.reduce(function(a,s){return a+s.hours},0);
    var start=as[0].start,end=as[as.length-1].end,deep=0,rem=0,core=0;
    as.forEach(function(s){
      if(DEEP.test(s.stage))deep+=s.hours;
      else if(REMX.test(s.stage))rem+=s.hours;
      else core+=s.hours;
    });
    var longAwake=p.segs.filter(function(s){return AWAKE.test(s.stage)&&s.start>=start&&s.end<=end&&s.hours>=0.25})
      .reduce(function(a,s){return a+s.hours},0);
    return {start:start,end:end,asleep:asleep,deep:deep,rem:rem,core:core,longAwake:longAwake,
      mid:new Date((+start + +end)/2), inBed:(end-start)/3600000, key:localKey(end),
      label:end.toLocaleDateString(undefined,{month:'short',day:'numeric'}), day:end.getDate()};
  }).filter(function(n){return n&&n.asleep>=2.5}).reverse();
}
function localKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hOf(d){return d.getHours()+d.getMinutes()/60}
function circ(h){return h<12?h+24:h}
function estimateNeed(ns){
  var s=ns.map(function(n){return n.asleep}).sort(function(a,b){return b-a});
  var t=Math.max(2,Math.round(s.length*0.2));
  return Math.min(9.5,Math.max(6.5,Math.round((s.slice(0,t).reduce(function(a,b){return a+b},0)/t)*4)/4));
}
function nightEff(n){
  var bed=n.inBed-(state.ext[n.key]?n.longAwake:0);
  return n.asleep/Math.max(n.asleep,bed);
}
function analyse(ns,ov){
  if(!ns.length) return null;
  var r=ns.slice(0,14), need=ov||estimateNeed(ns);
  var debt=r.reduce(function(a,n){return a+Math.max(0,need-n.asleep)},0);
  var avg=r.reduce(function(a,n){return a+n.asleep},0)/r.length;
  var eff=r.reduce(function(a,n){return a+nightEff(n)},0)/r.length;
  var w=r.map(function(n){return hOf(n.end)}).sort(function(a,b){return a-b});
  var wake=w[Math.floor(w.length/2)];
  var o=r.map(function(n){return circ(hOf(n.start))}).sort(function(a,b){return a-b});
  var onset=o[Math.floor(o.length/2)];
  var ideal=circ(wake)-(need+0.5);
  var target=Math.max(ideal,onset-0.5);
  var tot=r.reduce(function(a,n){return a+n.asleep},0);
  var score=Math.max(0,Math.min(100,Math.round(100*(1-debt/28))));
  return {need:need,debt:debt,avg:avg,eff:eff,wake:wake,onset:onset,target:target,score:score,
    stages:{deep:r.reduce(function(a,n){return a+n.deep},0)/tot,
            rem:r.reduce(function(a,n){return a+n.rem},0)/tot,
            core:r.reduce(function(a,n){return a+n.core},0)/tot},
    recent:r,n:r.length,total:ns.length};
}
var ANCHORS=[[-0.6,0.06],[0,0.22],[1,0.56],[2,0.82],[3.2,0.95],[5,0.90],[6.5,0.72],
  [8.8,0.44],[10.5,0.62],[12.5,0.74],[14,0.70],[15.8,0.38],[17,0.14],[18,0.05]];
function energyAt(h){
  var a=ANCHORS;
  if(h<=a[0][0])return a[0][1];
  if(h>=a[a.length-1][0])return a[a.length-1][1];
  for(var i=0;i<a.length-1;i++){
    if(h<=a[i+1][0]){var t=(h-a[i][0])/(a[i+1][0]-a[i][0]),s=t*t*(3-2*t);return a[i][1]+(a[i+1][1]-a[i][1])*s}
  }
  return 0;
}
function dFactor(d){return Math.max(0.42,1-Math.min(d,24)/42)}
function fmtClock(h){
  h=((h%24)+24)%24;
  var hh=Math.floor(h),mm=Math.round((h-hh)*60);
  if(mm===60){mm=0;hh=(hh+1)%24}
  var ap=hh>=12?'pm':'am',d=hh%12; if(d===0)d=12;
  return d+':'+String(mm).padStart(2,'0')+ap;
}
function fmtDur(h){var hh=Math.floor(h);return hh+'h '+String(Math.round((h-hh)*60)).padStart(2,'0')+'m'}
function fmtRel(h){var m=Math.round(h*60); if(m<60) return m+' min'; return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'}
function today(){return localKey(new Date())}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}

function habits(a){
  var B=a.target, W=a.wake, toB=circ(B)-circ(W); if(toB<0) toB+=24;
  var L=[
    {id:'light',  nm:'Get outside light',   sh:'light',        from:0.3,      to:1.3,       c:'var(--gold)'},
    {id:'caff',   nm:'Last caffeine',        sh:'caffeine',     at:toB-11,                   c:'var(--owed)'},
    {id:'nap',    nm:'Nap window, 20 min',  sh:'nap',          from:8.3,      to:9.3,       c:'var(--cool)', onlyIf:a.debt>5},
    {id:'move',   nm:'Move or train',        sh:'move',         from:9.5,      to:toB-2.5,   c:'var(--core)'},
    {id:'booze',  nm:'Last alcohol',         sh:'alcohol',      at:toB-4,                    c:'var(--owed)'},
    {id:'meal',   nm:'Last real meal',       sh:'meal',         at:toB-3,                    c:'var(--owed)'},
    {id:'dim',    nm:'Screens down, dim light', sh:'screens down', at:toB-1.5,               c:'var(--rem)'}
  ];
  return L.filter(function(h){return h.onlyIf===undefined||h.onlyIf})
          .map(function(h){
            h.start=(h.at!==undefined)?h.at:h.from;
            h.end=(h.at!==undefined)?h.at:h.to;
            h.time=(h.at!==undefined)?('by '+fmtClock(W+h.at)):(fmtClock(W+h.from)+' – '+fmtClock(W+h.to));
            return h;
          }).sort(function(x,y){return x.start-y.start});
}

function chart(a,hs,nh){
  var vw=window.innerWidth||1200;
  var W=Math.max(400,Math.min(1416,vw-104)), sm=W<600;
  var pL=8,pR=8, top=42, axis=sm?210:300;
  var s0=-1.2,s1=18.4, fs=13, step=sm?4:3;
  var lblY=axis+22, laneLbl=axis+50, lane=axis+72, hl0=lane+27, hl1=lane+43, H=hl1+8;
  function x(h){return pL+(h-s0)/(s1-s0)*(W-pL-pR)}
  function y(e){return top+(1-e)*(axis-top)}
  var f=dFactor(a.debt);
  function path(k){var d='';for(var h=s0;h<=s1;h+=0.12){d+=(d?'L':'M')+x(h).toFixed(1)+' '+y(energyAt(h)*k).toFixed(1)+' '}return d.trim()}
  var actual=path(f), o='';

  o+='<rect x="'+x(2.2).toFixed(1)+'" y="'+top+'" width="'+(x(5.4)-x(2.2)).toFixed(1)+'" height="'+(axis-top)+'" rx="10" fill="var(--gold)" opacity="0.08"/>';
  o+='<rect x="'+x(7.6).toFixed(1)+'" y="'+top+'" width="'+(x(9.9)-x(7.6)).toFixed(1)+'" height="'+(axis-top)+'" rx="10" fill="var(--cool)" opacity="0.14"/>';
  o+='<text x="'+x(3.8).toFixed(1)+'" y="'+(top+18)+'" fill="var(--gold)" font-size="'+fs+'" text-anchor="middle">peak</text>';
  o+='<text x="'+x(8.75).toFixed(1)+'" y="'+(top+18)+'" fill="var(--cool)" font-size="'+fs+'" text-anchor="middle">dip</text>';

  for(var h=0;h<=18;h+=step){
    o+='<line x1="'+x(h).toFixed(1)+'" y1="'+top+'" x2="'+x(h).toFixed(1)+'" y2="'+axis+'" stroke="var(--line)" stroke-width="1"/>';
    o+='<text x="'+x(h).toFixed(1)+'" y="'+lblY+'" fill="var(--dim)" font-size="'+fs+'" text-anchor="middle">'+fmtClock(a.wake+h)+'</text>';
  }

  o+='<path d="'+actual+' L'+x(s1).toFixed(1)+' '+y(0)+' L'+x(s0).toFixed(1)+' '+y(0)+' Z" fill="url(#fl)"/>';
  o+='<path d="'+path(1)+'" fill="none" stroke="var(--dim)" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.5"/>';
  o+='<path d="'+actual+'" fill="none" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/>';

  o+='<text x="'+pL+'" y="'+laneLbl+'" fill="var(--dim)" font-size="11" font-weight="600" letter-spacing="1.5">HABIT WINDOWS</text>';
  var labels=[];
  hs.forEach(function(hb){
    var cx;
    if(hb.at!==undefined){
      cx=x(hb.at);
      o+='<line x1="'+cx.toFixed(1)+'" y1="'+(lane-7)+'" x2="'+cx.toFixed(1)+'" y2="'+(lane+7)+'" stroke="'+hb.c+'" stroke-width="2.5" stroke-linecap="round"/>';
    } else {
      var x0=x(hb.from), x1v=x(hb.to);
      cx=(x0+x1v)/2;
      o+='<rect x="'+x0.toFixed(1)+'" y="'+(lane-5)+'" width="'+Math.max(4,(x1v-x0)).toFixed(1)+'" height="10" rx="5" fill="'+hb.c+'" opacity="0.75"/>';
    }
    labels.push({x:cx,t:hb.sh,w:hb.sh.length*fs*0.56});
  });
  labels.sort(function(p,q){return p.x-q.x});
  var last=[null,null];
  function fits(l,r){return !last[r]||Math.abs(l.x-last[r].x)>=(l.w+last[r].w)/2+14}
  labels.forEach(function(l){
    var row=fits(l,0)?0:fits(l,1)?1:-1;
    if(row<0) return;
    last[row]=l;
    var lx=Math.max(pL+l.w/2,Math.min(W-pR-l.w/2,l.x));
    o+='<text x="'+lx.toFixed(1)+'" y="'+(row?hl1:hl0)+'" fill="var(--dim)" font-size="'+fs+'" text-anchor="middle">'+l.t+'</text>';
  });

  if(nh>=s0&&nh<=s1){
    var nx=x(nh), txt='now · '+fmtClock(a.wake+nh), pw=txt.length*fs*0.56+22;
    var px=Math.max(pL+pw/2,Math.min(W-pR-pw/2,nx));
    o+='<line x1="'+nx.toFixed(1)+'" y1="'+(top-6)+'" x2="'+nx.toFixed(1)+'" y2="'+(lane+12)+'" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="3 4"/>';
    o+='<circle cx="'+nx.toFixed(1)+'" cy="'+y(energyAt(nh)*f).toFixed(1)+'" r="7" fill="var(--gold)" stroke="var(--ink-2)" stroke-width="3"/>';
    o+='<rect x="'+(px-pw/2).toFixed(1)+'" y="'+(top-34)+'" width="'+pw.toFixed(1)+'" height="24" rx="12" fill="var(--gold)"/>';
    o+='<text x="'+px.toFixed(1)+'" y="'+(top-17.5)+'" fill="var(--ink)" font-size="'+fs+'" font-weight="600" text-anchor="middle">'+txt+'</text>';
  }

  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Predicted energy and habit windows across today" style="font-family:ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif">'+
    '<defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="var(--gold)" stop-opacity="0.28"/>'+
    '<stop offset="100%" stop-color="var(--gold)" stop-opacity="0.02"/></linearGradient></defs>'+o+'</svg>';
}

function ringSVG(score){
  var r=35,c=2*Math.PI*r,on=c*score/100;
  return '<svg viewBox="0 0 78 78">'+
    '<circle cx="39" cy="39" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="4.5"/>'+
    '<circle cx="39" cy="39" r="'+r+'" fill="none" stroke="var(--gold)" stroke-width="4.5" stroke-linecap="round"'+
    ' stroke-dasharray="'+on.toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 39 39)"/></svg>';
}

    '<li><b>Combine Text</b> &mdash; Repeat Results, with New Lines</li>'+
    '<li><b>Copy to Clipboard</b></li>'+

    '</div></header>';

  if(!a){

      '<div class="eyebrow">Sleep debt &amp; energy curve</div>'+

    var pts=[

    /* energy card */

    var energyCard='<section class="card c12">'+

      '<div class="chartwrap">'+chart(a,hs,nh)+'</div>'+
      '<div class="legend">'+
      '<span><i class="sw" style="background:var(--gold)"></i>today</span>'+

  if(settings) settings.onclick=function(){ ui.open=true; render(); };
  var close=document.getElementById('close');
  if(close) close.onclick=function(){ ui.open=false; render(); };
  var overlay=document.getElementById('overlay');
  if(overlay) overlay.onclick=function(e){ if(e.target===overlay){ ui.open=false; render(); } };

  var grab=document.getElementById('grab');
  if(grab) grab.onclick=function(){
    if(!navigator.clipboard||!navigator.clipboard.readText){ render('Clipboard unavailable here — paste by hand.'); return; }
    navigator.clipboard.readText().then(function(t){
      if(!t||t.indexOf('|')===-1){ render('That clipboard doesn’t look like sleep data.'); return; }
      state.text=t; state.sample=false;
      var c=buildNights(parseSegments(t)).length;
      render(save()?'Updated. '+c+' night'+(c===1?'':'s')+' read.':c+' nights read, saving failed.');
    }).catch(function(){ render('Clipboard blocked — paste by hand.'); });
  };
  var sv=document.getElementById('save');
  if(sv) sv.onclick=function(){
    state.text=document.getElementById('ta').value; state.sample=false;
    var v=parseFloat(document.getElementById('need').value);
    state.need=isNaN(v)?null:v;
    var c=buildNights(parseSegments(state.text)).length;
    render(save()?'Saved. '+c+' night'+(c===1?'':'s')+' read.':c+' nights read, saving failed.');
  };
  var au=document.getElementById('auto');
  if(au) au.onclick=function(){
    state.text=document.getElementById('ta').value;
    state.need=null; save(); render('Need estimated from your longest nights.');
  };
}

document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&ui.open){ ui.open=false; render(); } });
var rt; window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(function(){ if(!ui.open) render(lastStatus); },150); });

load(function(){ render(); });
setInterval(function(){ if(!ui.open) render(); },300000);
})();
</script>
</body>
</html>
